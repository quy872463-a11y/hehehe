<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ec">
  <title>Một chút vui cho bạn</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');

    :root {
      color-scheme: light;
      --paper: #f8f5ec;
      --ink: #203d38;
      --muted: #66746b;
      --coral: #df684f;
      --yellow: #f3c95b;
      --green: #b9d8a7;
      --blue: #b8d9e2;
      --white: #fffdf7;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#66807120 0.8px, transparent 0.8px);
      background-size: 18px 18px;
      font-family: 'DM Sans', 'Trebuchet MS', sans-serif;
    }

    button { font: inherit; }

    .page {
      position: relative;
      display: grid;
      min-height: 100svh;
      place-items: center;
      padding: 28px 20px;
      isolation: isolate;
    }

    .shape {
      position: absolute;
      z-index: -1;
      pointer-events: none;
      border: 1px solid #203d3820;
    }

    .shape-sun {
      top: 8%;
      right: 10%;
      width: 88px;
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 0 12px #f3c95b30, 0 0 0 25px #f3c95b18;
      animation: float 5s ease-in-out infinite;
    }

    .shape-leaf {
      bottom: 10%;
      left: 9%;
      width: 104px;
      height: 58px;
      border-radius: 100% 0 100% 0;
      background: var(--green);
      transform: rotate(-25deg);
    }

    .shape-ring {
      top: 22%;
      left: 13%;
      width: 34px;
      aspect-ratio: 1;
      border: 2px solid var(--coral);
      border-radius: 50%;
    }

    .shape-spark {
      right: 17%;
      bottom: 18%;
      color: var(--coral);
      font-size: 42px;
      transform: rotate(12deg);
    }

    .content {
      width: min(100%, 620px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--coral);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1, h2 {
      margin-bottom: 18px;
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.08;
    }

    h1 { font-size: clamp(52px, 12vw, 92px); }
    h2 { font-size: clamp(42px, 9vw, 68px); }

    .intro-copy, .message-copy {
      max-width: 440px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    .tap-area {
      display: grid;
      justify-items: center;
      gap: 22px;
      width: 100%;
      padding: 28px 12px;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    .tap-area:focus-visible, .primary-button:focus-visible, .again-button:focus-visible {
      outline: 3px solid var(--coral);
      outline-offset: 6px;
      border-radius: 8px;
    }

    .welcome-sticker {
      display: grid;
      width: 138px;
      aspect-ratio: 1;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 44% 56% 51% 49% / 52% 44% 56% 48%;
      background: var(--yellow);
      box-shadow: 7px 8px 0 var(--ink);
      font-size: 67px;
      animation: wobble 4s ease-in-out infinite;
    }

    .tap-hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .second-screen { animation: arrive 500ms both; }

    .mini-flower {
      margin: 0 auto 12px;
      font-size: 45px;
      animation: float 4s ease-in-out infinite;
    }

    .primary-button, .again-button {
      display: inline-flex;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
      padding: 0 28px;
      color: var(--white);
      background: var(--coral);
      border: 2px solid var(--ink);
      border-radius: 999px;
      box-shadow: 4px 5px 0 var(--ink);
      cursor: pointer;
      font-weight: 700;
      transition: transform 150ms ease, box-shadow 150ms ease;
    }

    .primary-button:hover, .again-button:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 3px 0 var(--ink);
    }

    .message-screen { animation: arrive 450ms both; }

    .message-art {
      display: grid;
      width: 156px;
      aspect-ratio: 1;
      place-items: center;
      margin: 0 auto 30px;
      border: 2px solid var(--ink);
      border-radius: 48% 52% 44% 56% / 54% 43% 57% 46%;
      background: var(--blue);
      box-shadow: 6px 7px 0 var(--ink);
      font-size: 76px;
      animation: pop 450ms cubic-bezier(.2, .9, .25, 1.2) both;
    }

    .message-screen h2 {
      max-width: 600px;
      margin-right: auto;
      margin-left: auto;
      font-size: clamp(34px, 7vw, 56px);
    }

    .message-copy { min-height: 58px; }

    .again-button {
      margin-top: 24px;
      color: var(--ink);
      background: var(--yellow);
    }

    .counter {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .screen[hidden] { display: none; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.7) rotate(-10deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    @media (max-width: 520px) {
      .shape-sun { top: 7%; right: 7%; width: 56px; }
      .shape-leaf { bottom: 7%; left: 4%; width: 68px; height: 40px; }
      .shape-ring { top: 17%; left: 6%; width: 22px; }
      .shape-spark { right: 7%; bottom: 12%; font-size: 30px; }
      .welcome-sticker { width: 112px; font-size: 55px; }
      .message-art { width: 128px; margin-bottom: 24px; font-size: 62px; }
      .intro-copy, .message-copy { font-size: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="shape shape-sun" aria-hidden="true"></div>
    <div class="shape shape-leaf" aria-hidden="true"></div>
    <div class="shape shape-ring" aria-hidden="true"></div>
    <div class="shape shape-spark" aria-hidden="true">✳</div>

    <section class="content screen" id="welcome-screen" aria-labelledby="welcome-title">
      <button class="tap-area" id="welcome-next" type="button" aria-label="Chạm để tiếp tục">
        <span class="eyebrow">Một điều nho nhỏ dành cho bạn</span>
        <span class="welcome-sticker" aria-hidden="true">☀️</span>
        <span>
          <span class="eyebrow" style="display:block; margin:0 0 12px;">Xin chào!</span>
          <span class="tap-hint">Chạm vào bất kỳ đâu trên màn hình để tiếp tục ↗</span>
        </span>
      </button>
    </section>

    <section class="content screen second-screen" id="hello-screen" aria-labelledby="hello-title" hidden>
      <div class="mini-flower" aria-hidden="true">🌼</div>
      <p class="eyebrow">Bạn đến đúng lúc rồi đó</p>
      <h1 id="hello-title">Chào bạn!</h1>
      <p class="intro-copy">Ở đây có một chiếc túi nhỏ đựng toàn lời chúc vui vẻ. Không cần làm gì to tát đâu, mình chỉ muốn gửi bạn một chút dễ thương thôi!</p>
      <button class="primary-button" id="start-button" type="button">Bắt đầu <span aria-hidden="true">✦</span></button>
    </section>

    <section class="content screen message-screen" id="message-screen" aria-live="polite" aria-atomic="true" hidden>
      <div class="message-art" id="message-icon" aria-hidden="true">😊</div>
      <p class="eyebrow">Một chiếc lời chúc gửi bạn</p>
      <h2 id="message-title"></h2>
      <p class="message-copy" id="message-copy"></p>
      <button class="again-button" id="another-button" type="button"><span aria-hidden="true">↻</span> Cho mình lời khác</button>
      <p class="counter" id="message-counter"></p>
    </section>
  </main>

      { icon: '🌺', title: 'Bạn mang màu sắc riêng.', copy: 'Thế giới không cần thêm một bản sao. Cứ giữ nét riêng rực rỡ của bạn nhé.' },
      { icon: '🧇', title: 'Mong ngày bạn giòn tan niềm vui.', copy: 'Việc cần làm thì vừa sức, lúc nghỉ thì thật ngon, và mọi chuyện đều thơm phức như bánh mới nướng.' },
      { icon: '💫', title: 'Một điều tốt đẹp đang chờ bạn.', copy: 'Có thể nhỏ thôi, nhưng đủ làm mắt bạn sáng lên. Chúc bạn nhận ra nó khi nó xuất hiện.' }
    ];

    const welcomeScreen = document.querySelector('#welcome-screen');
    const helloScreen = document.querySelector('#hello-screen');
    const messageScreen = document.querySelector('#message-screen');
    const messageIcon = document.querySelector('#message-icon');
    const messageTitle = document.querySelector('#message-title');
    const messageCopy = document.querySelector('#message-copy');
    const messageCounter = document.querySelector('#message-counter');
    let lastMessageIndex = -1;
    let messagesShown = 0;

    function showMessage() {
      let nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * messages.length);
      } while (messages.length > 1 && nextIndex === lastMessageIndex);

      lastMessageIndex = nextIndex;
      messagesShown += 1;
      const message = messages[nextIndex];
      messageIcon.textContent = message.icon;
      messageTitle.textContent = message.title;
      messageCopy.textContent = message.copy;
      messageCounter.textContent = `Lời chúc thứ ${messagesShown} dành cho bạn`;
      messageIcon.style.animation = 'none';
      requestAnimationFrame(() => { messageIcon.style.animation = ''; });
    }

    document.querySelector('.page').addEventListener('click', () => {
      if (welcomeScreen.hidden) return;
      welcomeScreen.hidden = true;
      helloScreen.hidden = false;
      document.querySelector('#start-button').focus();
    });

    document.querySelector('#start-button').addEventListener('click', () => {
      helloScreen.hidden = true;
      messageScreen.hidden = false;
      showMessage();
      document.querySelector('#another-button').focus();
    });

    document.querySelector('#another-button').addEventListener('click', showMessage);
  </script>
</body>
</html>
